server:
  port: ${PORT:8081}

spring:
  application:
    name: fiscalimplify
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    user:
      name: _api_only_
      password: '{noop}_'
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/fiscaldb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

fiscalimplify:
  api:
    key: ${FISCAL_IMPLIFY_API_KEY:}
  webhook:
    secret: ${FISCAL_IMPLIFY_WEBHOOK_SECRET:}
  security:
    disable: ${FISCAL_IMPLIFY_SECURITY_DISABLE:false}

nuvemfiscal:
  auth-url: https://auth.nuvemfiscal.com.br
  base-url: https://api.sandbox.nuvemfiscal.com.br
  client-id: ${NUVEM_CLIENT_ID:seu_client_id_sandbox}
  client-secret: ${NUVEM_CLIENT_SECRET:seu_client_secret_sandbox}
  ambiente: homologacao
  scopes: ${NUVEM_SCOPES:empresa nfe nfce distribuicao-nfe}
  connect-timeout: 10000
  read-timeout: 30000
  emissao:
    poll-interval-ms: ${NUVEM_POLL_INTERVAL_MS:2000}
    poll-max-wait-seconds: ${NUVEM_POLL_MAX_WAIT_SECONDS:120}
  pdf:
    max-tentativas: ${NUVEM_PDF_MAX_TENTATIVAS:12}
    delay-ms: ${NUVEM_PDF_DELAY_MS:2500}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
