# Perfil railway — ajustes leves para 2 GB.

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:60}
      min-spare: 4
    max-connections: ${TOMCAT_MAX_CONNECTIONS:150}
    accept-count: 50
    connection-timeout: 30s
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:false}
    min-response-size: 2048

spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL:false}
  jmx:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      initialization-fail-timeout: 120000
      max-lifetime: 1200000
      idle-timeout: 300000
  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
        format_sql: false
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 25
        cache:
          use_second_level_cache: false
          use_query_cache: false
  task:
    scheduling:
      pool:
        size: 2
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
  codec:
    max-in-memory-size: ${WEBCLIENT_MAX_IN_MEMORY:1048576}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.fiscalimplify: ${APP_LOG_LEVEL:INFO}
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
