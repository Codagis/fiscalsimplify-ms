# Perfil railway (1 vCPU / 2 GB). Ative: SPRING_PROFILES_ACTIVE=homolog,railway

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:60}
      min-spare: 8
    max-connections: 150
    accept-count: 40
    connection-timeout: 20s
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: 1024

spring:
  main:
    banner-mode: off
  jmx:
    enabled: false
  datasource:
    url: jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}}:${PGPORT:${DB_PORT:5432}}}/${PGDATABASE:${DB_DATABASE:fiscaldb}}
    username: ${PGUSER:${DB_USERNAME:postgres}}
    password: ${PGPASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 20000
      initialization-fail-timeout: 60000
      max-lifetime: 600000
      idle-timeout: 180000
  jpa:
    properties:
      hibernate:
        generate_statistics: false
        format_sql: false
        jdbc:
          batch_size: 20
        query:
          plan_cache_max_size: 64
          in_clause_parameter_padding: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
  task:
    scheduling:
      pool:
        size: 2
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
  codec:
    max-in-memory-size: ${WEBCLIENT_MAX_IN_MEMORY:2097152}

logging:
  level:
    org.hibernate: WARN
    org.springframework: WARN
    com.zaxxer.hikari.HikariConfig: INFO
