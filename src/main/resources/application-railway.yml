# Perfil railway: otimização de memória em container (Railway).
# Ative com: SPRING_PROFILES_ACTIVE=homolog,railway (padrão no Dockerfile).

spring:
  main:
    banner-mode: off
  jmx:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      max-lifetime: 600000
      idle-timeout: 180000
  jpa:
    properties:
      hibernate:
        generate_statistics: false
        format_sql: false
        jdbc:
          batch_size: 20
        query:
          plan_cache_max_size: 64
          in_clause_parameter_padding: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
  task:
    scheduling:
      pool:
        size: 2
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
  codec:
    max-in-memory-size: ${WEBCLIENT_MAX_IN_MEMORY:524288}

server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:30}
      min-spare: 3
    max-connections: 60
    accept-count: 15
    connection-timeout: 20s
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: 1024

logging:
  level:
    org.hibernate: WARN
    org.springframework: WARN
