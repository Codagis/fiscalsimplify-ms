spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}}:${PGPORT:${DB_PORT:5432}}}/${PGDATABASE:${DB_DATABASE:fiscaldb}}
    username: ${PGUSER:${DB_USERNAME:postgres}}
    password: ${PGPASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
    open-in-view: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

server:
  port: ${PORT:8081}
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:false}
    min-response-size: 2048
  http2:
    enabled: false

logging:
  level:
    com.fiscalimplify: INFO
    org.springframework: WARN

